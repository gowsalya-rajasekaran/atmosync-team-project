version: 2

models:
  - name: mart_sensor_monitoring
    description: "Container sensor monitoring metrics"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - CONTAINER_ID
              - COMMODITY

    columns:
      - name: CONTAINER_ID
        data_tests:
          - not_null

      - name: COMMODITY
        data_tests:
          - not_null

      - name: TOTAL_SENSOR_EVENTS
        data_tests:
          - not_null

      - name: MIN_TEMPERATURE
        data_tests:
          - not_null

      - name: AVG_TEMPERATURE
        data_tests:
          - not_null

      - name: MAX_TEMPERATURE
        data_tests:
          - not_null

      - name: MIN_HUMIDITY
        data_tests:
          - not_null

      - name: AVG_HUMIDITY
        data_tests:
          - not_null

      - name: MAX_HUMIDITY
        data_tests:
          - not_null

      - name: MAX_VIBRATION
        data_tests:
          - not_null
