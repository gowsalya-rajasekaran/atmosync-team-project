
version: 2

models:
  - name: stg_container_sensors
    description: >
      Cleaned and standardized container sensor data extracted
      from the Snowflake raw sensor view. Duplicate events are
      removed and sensor fields are standardized for analysis.

    columns:
      - name: EVENT_ID
        description: "Unique identifier for each sensor event"
        data_tests:
          - not_null
          - unique

      - name: EVENT_TIMESTAMP
        description: "Date and time when the sensor event occurred"
        data_tests:
          - not_null

      - name: CONTAINER_ID
        description: "Identifier of the shipping container"
        data_tests:
          - not_null

      - name: TEMPERATURE
        description: "Temperature reading recorded by the container sensor"
        data_tests:
          - not_null

      - name: HUMIDITY
        description: "Humidity reading recorded by the container sensor"
        data_tests:
          - not_null

      - name: VIBRATION
        description: "Vibration reading recorded by the container sensor"
        data_tests:
          - not_null

      - name: COMMODITY
        description: "Type of commodity transported in the container"
        data_tests:
          - not_null

      - name: QUANTITY_KG
        description: "Quantity of commodity in kilograms"
        data_tests:
          - not_null

      - name: INGESTED_AT
        description: "Timestamp when the sensor event was ingested into Snowflake"
  - name: stg_avocado_sensors
    description: >
      Cleaned and standardized avocado container sensor data
      extracted from the isolated Snowflake avocado test view.

    columns:
      - name: EVENT_ID
        description: "Unique identifier for each avocado sensor event"
        data_tests:
          - not_null
          - unique

      - name: EVENT_TIMESTAMP
        data_tests:
          - not_null

      - name: CONTAINER_ID
        data_tests:
          - not_null

      - name: COMMODITY
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Avocados']

      - name: QUANTITY_KG
        data_tests:
          - not_null

      - name: TEMPERATURE
        data_tests:
          - not_null

      - name: HUMIDITY
        data_tests:
          - not_null

      - name: VIBRATION
        data_tests:
          - not_null
  - name: stg_container_gps
    description: >
      Cleaned and standardized GPS tracking data extracted
      from the Snowflake raw GPS table. Duplicate events
      are removed and GPS fields are validated.

    columns:
      - name: EVENT_ID
        description: "Unique identifier for each GPS event"
        data_tests:
          - not_null
          - unique

      - name: ROUTE_ID
        description: "Identifier of the container route"
        data_tests:
          - not_null

      - name: LEG_ID
        description: "Identifier of the transport leg"
        data_tests:
          - not_null

      - name: CONTAINER_ID
        description: "Identifier of the tracked container"
        data_tests:
          - not_null

      - name: TRANSPORT_MODE
        description: "Transport mode such as SEA or ROAD"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SEA', 'ROAD']

      - name: LATITUDE
        description: "GPS latitude coordinate"
        data_tests:
          - not_null

      - name: LONGITUDE
        description: "GPS longitude coordinate"
        data_tests:
          - not_null

      - name: LOCATION_TIMESTAMP
        description: "Timestamp when the GPS location was recorded"
        data_tests:
          - not_null
