version: 2

models:
  - name: stg_container_sensors
    description: "Cleaned and standardized container sensor data"

    columns:
      - name: EVENT_ID
        description: "Unique identifier for each sensor event"
        data_tests:
          - not_null
          - unique

      - name: CONTAINER_ID
        description: "Identifier of the shipping container"
        data_tests:
          - not_null

      - name: EVENT_TIMESTAMP
        description: "Timestamp when the sensor event occurred"
        data_tests:
          - not_null

      - name: TEMPERATURE
        description: "Container temperature reading"
        data_tests:
          - not_null

      - name: HUMIDITY
        description: "Container humidity reading"
        data_tests:
          - not_null

      - name: VIBRATION
        description: "Container vibration reading"
        data_tests:
          - not_null

      - name: COMMODITY
        data_tests:
          - not_null

      - name: QUANTITY_KG
        data_tests:
          - not_null
